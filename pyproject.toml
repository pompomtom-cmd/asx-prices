[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asxdb"
version = "0.1.0"
description = "ASX end-of-day price history with corporate actions, in SQLite, for backtesting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
asxdb = "asxdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asxdb = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
